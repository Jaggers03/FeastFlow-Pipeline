version: '3.9'
# ── FeastFlow — Test Compose ──────────────────────────────────
# Spins up real services for integration tests in Jenkins

services:
  feastflow-backend:
    build: ./backend
    container_name: feastflow-backend-test
    environment:
      NODE_ENV: test
      PORT: 3001
    ports:
      - "3001:3001"
    networks: [feastflow-test]
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  feastflow-test:
    driver: bridge
